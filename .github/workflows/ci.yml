name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: npm ci
      - run: pnpm --dir demos/reward-pocket install --frozen-lockfile
      - run: npm run test:demo
      - run: npm run build:demo
      - run: git diff --exit-code -- public/demos/reward-pocket
      - name: Check for untracked demo assets
        run: test -z "$(git ls-files --others --exclude-standard public/demos/reward-pocket)"
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run test:static
